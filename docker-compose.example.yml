services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://exchange_io:${POSTGRES_PASSWORD}@db:5432/exchange_io}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      DAILY_RATE_BASE: ${DAILY_RATE_BASE:-EUR}
      ANALYTICS_SALT: ${ANALYTICS_SALT:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: exchange_io
      POSTGRES_USER: exchange_io
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange_io -d exchange_io"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
